[project]
name = "moss-agent-analytics-os-backend"
version = "0.1.0"
description = "Phase 1 backend skeleton for MOSS Agent Analytics OS"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "anyio>=4.0,<5",
  "fastapi>=0.115,<0.137",
  # starlette 是 fastapi 的传递依赖，但被直接暴露在 ASGI 中间件/响应链路上。
  # 不显式约束时它已经从 0.x 静默跨到 1.x major；此处钉住 major，让下一次
  # 跨代升级必须走显式解析失败而不是悄悄进环境。
  "starlette>=1.3,<2",
  "uvicorn>=0.34,<1",
  "requests>=2.32,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "duckdb>=1.2,<2",
  "redis>=6,<7",
  "dramatiq>=1.17,<2",
  "minio>=7.2,<8",
  "arch>=7.0,<8",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.13,<2",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-xdist>=3.6,<4",
]
# macro toolkit 脚本经 macro_toolkit_service 以子进程方式在运行时执行；
# 这些包是那条链路的真实运行依赖，声明在此让它们进 uv.lock 与 OSV 扫描面。
# 调用点全部带 importlib.util.find_spec 守卫，因此不装本 extra 时功能降级而非崩溃。
toolkit = [
  "matplotlib>=3.9,<4",
  "python-docx>=1.1,<2",
]
# 行情/资讯摄取 worker 的 vendor SDK。代码中全部是函数体内惰性 import，
# 不装本 extra 时对应摄取任务在调用时报错，API 启动与测试收集不受影响。
# WindPy / EmQuantAPI 由 Wind / Choice 终端捆绑分发，PyPI 无对应包，无法进 lock。
vendor = [
  "akshare>=1.18,<2",
  "tushare>=1.4,<2",
]
otel = [
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
    "opentelemetry-instrumentation-requests>=0.60b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.60b0,<1",
    "opentelemetry-sdk>=1.39,<2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S110",  # flake8-bandit: try-except-pass must log or carry a noqa'd reason
    "S112",  # flake8-bandit: try-except-continue must log or carry a noqa'd reason
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI pattern)
    "B904",  # raise from within except (too noisy for existing code)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "F841"]
"app/core_finance/macro/toolkit/scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
