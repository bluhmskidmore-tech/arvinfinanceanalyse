name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Run bounded backend release suite
        run: python scripts/backend_release_suite.py --governance-audit-output governance-lineage-audit.json

      - name: Upload governance lineage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-lineage-audit
          path: governance-lineage-audit.json

  backend-full-pytest:
    name: Backend Full Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Run full backend pytest suite
        run: python -m pytest -q

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npx vitest run

      - name: Frontend debt audit
        run: npm run debt:audit

      - name: Production build
        run: VITE_DATA_SOURCE=real npm run build

  frontend-a11y-smoke-shard:
    name: Frontend Accessibility Smoke Shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-of-4
            shard_arg: 1/4
          - shard: 2-of-4
            shard_arg: 2/4
          - shard: 3-of-4
            shard_arg: 3/4
          - shard: 4-of-4
            shard_arg: 4/4

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: .
        run: pip install -e "./backend[dev]"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start backend API
        working-directory: .
        env:
          MOSS_SKIP_STARTUP_STORAGE_MIGRATIONS: "1"
          MOSS_SKIP_POSTGRES_MIGRATIONS: "1"
          MOSS_AUTH_TRUST_X_USER_ROLE_FOR_DEV_TEST: "1"
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 7888 > backend-smoke.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:7888/health; then
              exit 0
            fi
            sleep 2
          done
          cat backend-smoke.log
          exit 1

      - name: Frontend accessibility smoke
        env:
          MOSS_PLAYWRIGHT_USE_WEB_SERVER: "1"
          MOSS_PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5888"
          MOSS_PLAYWRIGHT_OUTPUT_DIR: "../playwright-smoke-results"
        run: npm run test:a11y-smoke -- --workers=1 --shard=${{ matrix.shard_arg }} --reporter=github,line

      - name: Upload Playwright smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-a11y-smoke-${{ matrix.shard }}
          path: playwright-smoke-results
          if-no-files-found: ignore

      - name: Upload backend smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-a11y-backend-${{ matrix.shard }}
          path: backend-smoke.log
          if-no-files-found: ignore

  frontend-a11y-smoke:
    name: Frontend Accessibility Smoke
    runs-on: ubuntu-latest
    needs: frontend-a11y-smoke-shard
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check accessibility smoke shard results
        run: |
          if [ "${{ needs.frontend-a11y-smoke-shard.result }}" != "success" ]; then
            echo "One or more accessibility smoke shards failed."
            exit 1
          fi

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Surface naming lint
        working-directory: .
        run: node scripts/check_surface_naming.mjs

      - name: ESLint
        run: npx eslint .

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend tooling
        working-directory: frontend
        run: npm ci

      - name: Export OpenAPI contract
        run: python scripts/api_contract_check.py export-openapi --output .codex-tmp/openapi.json

      - name: Lint OpenAPI contract
        run: npx --prefix frontend spectral lint .codex-tmp/openapi.json -r .spectral.yaml

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz |
            sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: python scripts/supply_chain_security_scan.py --tool gitleaks

      - name: Run supply-chain scan plan
        run: python scripts/supply_chain_security_scan.py --dry-run

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: test_output/security-scans/gitleaks-report.json

  osv:
    name: OSV Dependency Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.0
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      upload-sarif: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/master' }}
      scan-args: |-
        --lockfile=backend/uv.lock
        --lockfile=frontend/package-lock.json
