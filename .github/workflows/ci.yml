name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 18 * * *"

# event_name 纳入分组：防止 main push 取消同 ref 的 schedule 全量运行（被取消不算失败，会绕过失败通知闭环）
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check backend uv.lock consistency
        run: uv lock --check --project backend

      # 安装即 lock：`uv sync --frozen` 严格按 backend/uv.lock 装，不再二次解析。
      # 把 venv 前置进 PATH/VIRTUAL_ENV，后续步骤的裸 `python` 仍指向这套环境，
      # 因此各 run 步骤无需逐条加 `uv run` 前缀（漏加即 ModuleNotFoundError）。
      - name: Install backend dependencies from backend/uv.lock
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Run bounded backend release suite
        run: python scripts/backend_release_suite.py

      - name: Run agent harness tests
        run: >-
          python -m pytest -q
          tests/test_agent_eval_spec.py
          tests/test_agent_eval_reward.py
          tests/test_agent_eval_collect.py
          tests/test_agent_eval_scoring_integrity.py
          tests/test_agent_eval_replay.py
          tests/test_agent_eval_pr_replay.py
          tests/test_agent_eval_rollout.py
          tests/test_agent_eval_coverage_report.py
          tests/test_agent_sql_disclosure_drift.py
          tests/test_agent_api_contract.py
          tests/test_agent_audit_log_contract.py
          tests/test_dexter_agent_service.py
          tests/test_agent_run_service_lifecycle.py
          tests/test_agent_run_cancellation_hook.py
          tests/test_caliber_gate_mapping.py
          tests/test_ci_workflow_contents.py
          tests/test_mcp_config_consistency.py

  # 路径检查独立计时，避免前置 release suite 与 harness 用尽同一 job 的预算。
  backend-caliber:
    name: Caliber Path Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      # fetch-depth: 0：Caliber path-trigger gate 需要完整历史做 base-ref diff
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check backend uv.lock consistency
        run: uv lock --check --project backend

      - name: Install backend dependencies from backend/uv.lock
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "$GITHUB_PATH"

      # PR diff 触及已映射的口径与正式计算路径时运行相应检查；
      # 映射表与 fail-closed 语义见 scripts/check_caliber_gate.py
      - name: Caliber path-trigger gate
        run: |
          git fetch origin "${{ github.base_ref }}"
          mkdir -p .codex-tmp
          python scripts/check_caliber_gate.py --base-ref "origin/${{ github.base_ref }}" --dry-run --shadow-selection > .codex-tmp/caliber-selection.json
          python scripts/check_caliber_gate.py --base-ref "origin/${{ github.base_ref }}"

      - name: Report caliber selection scope
        if: always()
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          lines = ["### Caliber path selection", ""]
          report = None
          try:
              report = json.loads(Path(".codex-tmp/caliber-selection.json").read_text(encoding="utf-8"))
              for key in ("mapped_files", "unmapped_files", "matched_tests"):
                  if not isinstance(report[key], list) or not all(isinstance(path, str) for path in report[key]):
                      raise ValueError(f"invalid {key}")
              for key in ("selection_scope", "selection_note"):
                  if not isinstance(report[key], str):
                      raise ValueError(f"invalid {key}")
              lines.extend([
                  html.escape(report["selection_scope"]), "",
                  html.escape(report["selection_note"]), "",
                  "Full backend pytest has its separate schedule/main-push job; this selection report does not record that job or any test result.", "",
              ])
              for key, label in (("mapped_files", "Mapped changed paths"), ("matched_tests", "Selected test files"), ("unmapped_files", "Paths not mapped by this gate")):
                  paths = report[key]
                  lines.extend([f"<details><summary>{label}: {len(paths)}</summary>", "<ul>"])
                  lines.extend(f"<li><code>{html.escape(path)}</code></li>" for path in paths)
                  lines.extend(["</ul></details>", ""])
          except (OSError, ValueError, KeyError, TypeError) as exc:
              lines.append(f"Selection report unavailable or invalid: {html.escape(str(exc))}. No empty-selection or coverage conclusion can be drawn.")
          lines.extend(["", "### Shadow regression advice (not executed)", ""])
          try:
              shadow = report["shadow_selection"]
              if shadow["mode"] != "advisory_only" or shadow["status"] not in {"available", "unavailable"}:
                  raise ValueError("invalid shadow mode or status")
              for key in ("mandatory_test_file_count", "additional_registered_test_count"):
                  if type(shadow[key]) is not int or shadow[key] < 0:
                      raise ValueError(f"invalid shadow {key}")
              if shadow["mandatory_test_file_count"] != len(report["matched_tests"]):
                  raise ValueError("shadow and mandatory selection counts differ")
              if not isinstance(shadow["recommended_jobs"], list) or not all(
                  job in {"backend-full-pytest", "frontend", "api-contract"} for job in shadow["recommended_jobs"]
              ):
                  raise ValueError("invalid shadow job recommendations")
              if not isinstance(shadow["reasons"], list):
                  raise ValueError("invalid shadow reasons")
              lines.extend([
                  "Recommendations were not executed. Mandatory test selection and existing job conditions are unchanged.", "",
                  f"Advice status: {shadow['status']}; recommended existing jobs: {', '.join(shadow['recommended_jobs']) or '(none)'}.", "",
                  f"Additional registered checks suggested from rename/deletion evidence: {shadow['additional_registered_test_count']}.", "",
              ])
              for reason in shadow["reasons"]:
                  if not isinstance(reason["reason"], str) or type(reason["path_count"]) is not int or reason["path_count"] < 0:
                      raise ValueError("invalid shadow reason")
                  if not isinstance(reason["path_examples"], list) or not all(isinstance(path, str) for path in reason["path_examples"]):
                      raise ValueError("invalid shadow path examples")
                  examples = ", ".join(html.escape(path) for path in reason["path_examples"][:3])
                  lines.extend([f"{html.escape(reason['reason'])}: {reason['path_count']} paths. Examples: {examples}", ""])
          except (ValueError, KeyError, TypeError) as exc:
              lines.append(f"Shadow advice unavailable or invalid: {html.escape(str(exc))}. No narrowing or coverage conclusion can be drawn; the mandatory gate is unchanged.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

  release-control-structure:
    name: Release Control Structure (not approval)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Dedicated disposable database for the WP1 real PostgreSQL CAS race.
    # This remains structural evidence and does not make an approval decision.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moss_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: moss_release_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U moss_test -d moss_release_control_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      MOSS_TEST_POSTGRES_DSN: postgresql+psycopg://moss_test@127.0.0.1:5432/moss_release_control_test
      MOSS_REQUIRE_POSTGRES_CONCURRENCY_TEST: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check backend uv.lock consistency
        run: uv lock --check --project backend

      - name: Install backend dependencies from backend/uv.lock
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Migrate disposable PostgreSQL release-control authority
        env:
          MOSS_POSTGRES_DSN: postgresql+psycopg://moss_test@127.0.0.1:5432/moss_release_control_test
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run PostgreSQL whole-bundle CAS concurrency proof
        run: |
          mkdir -p .codex-tmp/release-control
          python -m pytest -q \
            tests/test_release_control_postgres_concurrency.py \
            --junitxml=.codex-tmp/release-control/postgres-cas-junit.xml

      - name: Require both PostgreSQL race cases and zero skips
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(".codex-tmp/release-control/postgres-cas-junit.xml")
          root = ElementTree.parse(report).getroot()
          suites = list(root.iter("testsuite"))
          totals = {
              key: sum(int(suite.attrib.get(key, "0")) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          assert totals == {
              "tests": 2,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
          }, totals
          names = {case.attrib["name"] for case in root.iter("testcase")}
          assert names == {
              "test_postgres_whole_bundle_cas_allows_exactly_one_existing_alias_winner",
              "test_postgres_whole_bundle_cas_allows_exactly_one_first_insert_winner",
          }, names
          PY

      - name: Validate release approval registry structure only
        run: |
          mkdir -p .codex-tmp/release-control
          python scripts/check_release_approval_registry.py > .codex-tmp/release-control/structure-only.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(".codex-tmp/release-control/structure-only.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["status"] == "structure_passed", payload
          assert payload["structure_only"] is True, payload
          assert payload["gate_scope"] == "structure_only", payload
          assert payload["approval_decision"] == "not_evaluated", payload
          assert payload["fail_closed_for_release_approval"] is True, payload
          assert payload["release_gate_eligible"] is False, payload
          PY

      - name: Run release control structure pytest
        run: >-
          python -m pytest -q
          tests/test_release_control_schema.py
          tests/test_release_control_state_machine.py
          tests/test_release_control_repo.py
          tests/test_release_control_cli.py
          tests/test_release_approval_registry.py
          tests/test_bond_risk_shadow_candidate.py
          tests/test_fixed_income_version_set.py
          tests/test_bond_risk_shadow_batch.py

      - name: Upload release control structure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-control-structure
          path: |
            .codex-tmp/release-control/structure-only.json
            .codex-tmp/release-control/postgres-cas-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # 信息性评测：按 diff 与任务 pr_trigger_scope 的交集选任务，跑重放评测并把
  # scorecard 发布为 step summary + PR 评论。评测 fail/void 不阻塞合并；
  # 本 job 变红仅代表编排自身故障（见 scripts/agent_eval/pr_replay.py）。
  agent-eval-replay:
    name: Agent Eval Replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check PR replay dependency setup
        id: agent_eval_preflight
        run: |
          git fetch origin "${{ github.base_ref }}"
          python scripts/agent_eval/pr_replay.py --base-ref "origin/${{ github.base_ref }}" \
            --preflight >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.agent_eval_preflight.outputs.needs_dependency_setup != 'false'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from backend/uv.lock
        if: steps.agent_eval_preflight.outputs.needs_dependency_setup != 'false'
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        if: steps.agent_eval_preflight.outputs.needs_dependency_setup != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.agent_eval_preflight.outputs.needs_dependency_setup != 'false'
        working-directory: frontend
        run: npm ci

      # 页面探针需要 Chromium 与 mock 数据模式；spec 在非 mock 环境下自动 skip。
      - name: Install Playwright Chromium
        if: steps.agent_eval_preflight.outputs.needs_dependency_setup != 'false'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run PR replay evaluation
        env:
          VITE_DATA_SOURCE: "mock"
          MOSS_PLAYWRIGHT_USE_WEB_SERVER: "1"
          MOSS_PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5888"
        run: |
          python scripts/agent_eval/pr_replay.py --base-ref "origin/${{ github.base_ref }}" \
            --out-md .codex-tmp/agent-eval/pr-replay/summary.md

      - name: Publish step summary
        if: always() && hashFiles('.codex-tmp/agent-eval/pr-replay/summary.md') != ''
        run: cat .codex-tmp/agent-eval/pr-replay/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR comment
        if: always() && hashFiles('.codex-tmp/agent-eval/pr-replay/summary.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- moss-agent-eval-replay -->";
            const body = fs.readFileSync(".codex-tmp/agent-eval/pr-replay/summary.md", "utf8");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Upload replay archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-pr-replay
          path: .codex-tmp/agent-eval/pr-replay/
          retention-days: 14
          if-no-files-found: ignore

  backend-full-pytest:
    name: Backend Full Pytest (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-backend-regression'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            python_dir: bin
            marker: not windows_native
          - platform: windows
            os: windows-latest
            python_dir: Scripts
            marker: windows_native
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for native command argument contracts
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # 该 job 此前连 lock 校验都没有；改走 --frozen 后天然获得 lock 强制。
      - name: Check backend uv.lock consistency
        run: uv lock --check --project backend

      - name: Install backend dependencies from backend/uv.lock
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/${{ matrix.python_dir }}" >> "$GITHUB_PATH"

      - name: Require platform PowerShell runtime
        run: python -c "import os, shutil; name = 'powershell' if os.name == 'nt' else 'pwsh'; assert shutil.which(name), name + ' is required'"

      - name: Run full backend pytest suite
        id: full-pytest
        run: |
          mkdir -p test_output/ci
          python -m pytest -n 4 --dist loadfile -v --tb=short \
            -p tests.full_pytest_inventory \
            -m "${{ matrix.marker }}" \
            --full-pytest-platform=${{ matrix.platform }} \
            --full-pytest-inventory=test_output/ci/full-pytest-inventory.json \
            --junitxml=test_output/ci/full-pytest-report.xml \
            2>&1 | tee test_output/ci/full-pytest-console.log
          exit "${PIPESTATUS[0]}"

      - name: Write full pytest summary
        if: always()
        run: |
          {
            echo "## Backend Full Pytest (${{ matrix.platform }}, ${GITHUB_EVENT_NAME})"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- conclusion: ${{ steps.full-pytest.outcome }}"
            echo "- platform selector: ${{ matrix.marker }}"
            echo "- Combined full-suite coverage requires the partition guard and both platform artifacts."
            echo ""
            echo '```text'
            tail -n 80 test_output/ci/full-pytest-console.log || echo "(no console log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-pytest-${{ matrix.platform }}
          path: |
            test_output/ci/full-pytest-report.xml
            test_output/ci/full-pytest-console.log
            test_output/ci/full-pytest-inventory.json
          retention-days: 14
          if-no-files-found: warn

  backend-full-pytest-partition:
    name: Backend Full Pytest Coverage
    runs-on: ubuntu-latest
    needs: backend-full-pytest
    if: always() && needs.backend-full-pytest.result != 'skipped'
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download both platform execution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-full-pytest-*
          path: test_output/ci/partition-input

      - name: Verify complete full pytest platform execution
        run: |
          python scripts/check_full_pytest_partition.py \
            --linux-dir test_output/ci/partition-input/backend-full-pytest-linux \
            --windows-dir test_output/ci/partition-input/backend-full-pytest-windows \
            --output test_output/ci/full-pytest-partition.json

      - name: Write combined full pytest accounting
        if: always()
        run: |
          {
            echo "## Combined Full Pytest Execution"
            echo '```json'
            cat test_output/ci/full-pytest-partition.json || echo '{"coverage_complete": false, "error": "No combined execution report was produced"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined full pytest accounting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-pytest-partition
          path: test_output/ci/full-pytest-partition.json
          retention-days: 14
          if-no-files-found: warn

      - name: Open or update failure tracking issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "ci-full-pytest-failure";
            const title = "[CI] Scheduled backend full pytest failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled full backend pytest failed on \`${context.ref}\`.`,
              "",
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              "- Evidence artifacts: `backend-full-pytest-linux`, `backend-full-pytest-windows`, `backend-full-pytest-partition` (JUnit, collection inventories, console logs and combined accounting; retained 14 days)",
              "",
              "Triage: see docs/plans/tech-debt-remediation/B0-ci-gate-layering.md (close this issue only after a green scheduled run).",
            ].join("\n");
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "b60205",
                description: "Scheduled backend full pytest is red",
              });
            }
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            }

  backend-lint:
    name: Backend Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.15.7"

      # S110/S112 存量已清零（2026-08-12），作硬门禁；--select 显式覆盖使 scripts/ 与 tests/ 也被检查
      - name: Ruff silent-exception gate (S110/S112)
        run: python -m ruff check backend scripts tests --select S110,S112

      # 逐条冻结存量；删除一处旧问题不能抵消另一处新增问题。
      - name: Ruff BLE001 baseline ratchet
        if: github.event_name != 'pull_request'
        run: python scripts/check_ruff_ble001_baseline.py

      - name: Ruff BLE001 trusted PR baseline ratchet
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_ruff_ble001_baseline.py --baseline-ref "${{ github.event.pull_request.base.sha }}"
          --derive-missing-baseline .codex-tmp/trusted-pr-base

  mypy-ratchet:
    name: Backend Mypy Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 按可信历史诊断身份阻断新增问题；CI 不更新或扩大基线。

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from backend/uv.lock
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "$GITHUB_PATH"

      # mypy 刻意不入 uv.lock：它钉在基线采集版本上，与运行时依赖面解耦。
      # uv sync 出来的 venv 不含 pip，故用 uv pip install 装进同一 venv。
      - name: Install mypy (pinned to baseline measurement version)
        run: uv pip install --python "${GITHUB_WORKSPACE}/backend/.venv" "mypy==1.20.1"

      - name: Cache mypy incremental state
        uses: actions/cache@v4
        with:
          path: .tmp/mypy_cache
          key: mypy-ratchet-${{ runner.os }}-py311-mypy1.20.1-${{ github.sha }}
          restore-keys: |
            mypy-ratchet-${{ runner.os }}-py311-mypy1.20.1-

      - name: Test mypy diagnostic identity and update guards
        run: >-
          python -m pytest -p _pytest_duckdb_guard -q
          tests/test_check_mypy_baseline.py
          tests/test_backend_debt_gate.py
          tests/test_mypy_import_boundary.py

      - name: Run mypy baseline ratchet
        run: python scripts/check_mypy_baseline.py

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests, frontend-build]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check frontend lane results
        env:
          FRONTEND_UNIT_RESULT: ${{ needs.frontend-unit-tests.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          python - <<'PY'
          import os
          import sys
          results = {
              "unit": os.environ.get("FRONTEND_UNIT_RESULT"),
              "build": os.environ.get("FRONTEND_BUILD_RESULT"),
          }
          for lane, result in results.items():
              print(f"Frontend {lane}: {result}")
          if any(result != "success" for result in results.values()):
              print("One or more frontend lanes did not complete successfully.")
              sys.exit(1)
          PY

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: frontend_dependencies
        run: npm ci

      - name: Run Vitest
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            npm test -- --coverage
          else
            npm test
          fi

      - name: Upload full frontend coverage
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build and Runtime Boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: frontend_dependencies
        run: npm ci

      - name: TypeScript type check
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Frontend debt audit
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        run: npm run debt:audit

      - name: Install Chromium for runtime boundary checks
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Test production mock bundle boundary
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        run: >-
          node --test
          scripts/productionMockBoundary.node-test.mjs
          scripts/homeRuntimeAcceptance.test.mjs
          scripts/startupBundleParsing.test.mjs
          scripts/visual-compliance-audit.test.mjs

      - name: Production build
        if: ${{ !cancelled() && steps.frontend_dependencies.outcome == 'success' }}
        run: VITE_DATA_SOURCE=real npm run build

  source-development-entry:
    name: Source Development Entry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        shell: bash
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          npm ci --prefix frontend

      - name: Install browser for isolated application acceptance
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify guarded startup and isolated real application
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            MOSS_PYTHON="$GITHUB_WORKSPACE/backend/.venv/Scripts/python.exe"
          else
            MOSS_PYTHON="$GITHUB_WORKSPACE/backend/.venv/bin/python"
          fi
          export MOSS_PYTHON
          export MOSS_TEST_FULL_APP=1
          mkdir -p .codex-tmp
          "$MOSS_PYTHON" -m pytest tests/test_dev_frontend_source_entry.py tests/test_dev_frontend_source_live.py tests/test_dev_frontend_application_live.py tests/test_dev_python_resolution.py tests/test_codex_python_resolution.py tests/test_dev_runtime_control.py -q --basetemp=.codex-tmp/source-entry-ci

      - name: Retain isolated application acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: source-application-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .codex-tmp/source-entry-ci/**/real-application/acceptance.json
            .codex-tmp/source-entry-ci/**/real-application/browser-result.json
            .codex-tmp/source-entry-ci/**/real-application/positions.png
            .codex-tmp/source-entry-ci/**/real-application/api.log
            .codex-tmp/source-entry-ci/**/real-application/frontend.log
          retention-days: 7
          if-no-files-found: warn

  compose-runtime-acceptance:
    name: Compose Runtime Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify isolated Compose runtime
        run: node scripts/verify_compose_runtime.mjs --run --output .codex-tmp/compose-runtime-ci

      - name: Retain isolated Compose acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-runtime-acceptance
          include-hidden-files: true
          path: |
            .codex-tmp/compose-runtime-ci/acceptance.json
            .codex-tmp/compose-runtime-ci/readiness.json
            .codex-tmp/compose-runtime-ci/compose.log
            .codex-tmp/compose-runtime-ci/build.log
          retention-days: 7
          if-no-files-found: warn

  frontend-a11y-smoke-shard:
    name: Frontend Accessibility Smoke Shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-of-4
            shard_arg: 1/4
          - shard: 2-of-4
            shard_arg: 2/4
          - shard: 3-of-4
            shard_arg: 3/4
          - shard: 4-of-4
            shard_arg: 4/4

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies from backend/uv.lock
        working-directory: .
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start backend API
        working-directory: .
        env:
          MOSS_SKIP_STARTUP_STORAGE_MIGRATIONS: "1"
          MOSS_SKIP_POSTGRES_MIGRATIONS: "1"
          MOSS_AUTH_TRUST_X_USER_ROLE_FOR_DEV_TEST: "1"
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 7888 > backend-smoke.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:7888/health; then
              exit 0
            fi
            sleep 2
          done
          cat backend-smoke.log
          exit 1

      - name: Frontend accessibility smoke
        env:
          MOSS_PLAYWRIGHT_USE_WEB_SERVER: "1"
          MOSS_PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5888"
          MOSS_PLAYWRIGHT_OUTPUT_DIR: "../playwright-smoke-results"
        run: npm run test:a11y-smoke -- --workers=1 --shard=${{ matrix.shard_arg }} --reporter=github,line

      - name: Frontend stock-analysis mock smoke
        if: matrix.shard == '1-of-4'
        env:
          MOSS_PLAYWRIGHT_USE_WEB_SERVER: "1"
          MOSS_PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5888"
          MOSS_PLAYWRIGHT_OUTPUT_DIR: "../playwright-smoke-results/stock-mock"
          VITE_DATA_SOURCE: "mock"
        run: npm run test:a11y-smoke -- tests/playwright/stock-analysis-mock-smoke.spec.mjs

      - name: Upload Playwright smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-a11y-smoke-${{ matrix.shard }}
          path: playwright-smoke-results
          if-no-files-found: ignore

      - name: Upload backend smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-a11y-backend-${{ matrix.shard }}
          path: backend-smoke.log
          if-no-files-found: ignore

  frontend-a11y-smoke:
    name: Frontend Accessibility Smoke
    runs-on: ubuntu-latest
    needs: frontend-a11y-smoke-shard
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check accessibility smoke shard results
        run: |
          if [ "${{ needs.frontend-a11y-smoke-shard.result }}" != "success" ]; then
            echo "One or more accessibility smoke shards failed."
            exit 1
          fi

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Surface naming lint
        working-directory: .
        run: node scripts/check_surface_naming.mjs

      - name: ESLint
        run: npx eslint .

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0：破坏性变更门禁要读 base 分支上的 OpenAPI 基线做 diff
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies from backend/uv.lock
        run: |
          uv sync --frozen --project backend --extra dev --python 3.11
          echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/backend/.venv" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend tooling
        working-directory: frontend
        run: npm ci

      # --surface default 钉死 MOSS_AGENT_ENABLED，导出面不再随环境摆动
      - name: Export OpenAPI contract
        run: python scripts/api_contract_check.py export-openapi --surface default --output .codex-tmp/openapi.json

      - name: Lint OpenAPI contract
        run: node frontend/scripts/lintOpenApi.mjs .codex-tmp/openapi.json -r .spectral.yaml

      - name: Test OpenAPI lint command semantics
        run: node --test frontend/scripts/lintOpenApi.node-test.mjs

      # 对 base 分支上的基线做 diff，而不是对本 PR 工作树里的基线：
      # 同一个 PR 里重跑 baseline-update 覆盖快照因此清不掉破坏性发现，
      # 只能靠 contracts/openapi/breaking-change-acknowledgements.json 里的显式条目放行。
      - name: OpenAPI breaking-change gate
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          python scripts/api_contract_check.py baseline-check \
            --baseline-ref "${{ github.event.pull_request.base.sha }}" \
            --derive-missing-baseline .codex-tmp/trusted-pr-base \
            --json .codex-tmp/openapi-contract-gate.json

      # 非 PR 事件没有 base 分支可比：退化成"提交的快照是否还等于当前代码"。
      - name: OpenAPI baseline freshness
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/api_contract_check.py baseline-check
          --json .codex-tmp/openapi-contract-gate.json

      - name: Upload OpenAPI contract gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract-gate
          path: .codex-tmp/openapi-contract-gate.json
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz |
            sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: python scripts/supply_chain_security_scan.py --tool gitleaks

      - name: Run supply-chain scan plan
        run: python scripts/supply_chain_security_scan.py --dry-run

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: test_output/security-scans/gitleaks-report.json

  osv:
    name: OSV Dependency Scan
    # 依赖漏洞面与前端 lint/test 结果无因果关系；此前的 `needs: frontend`
    # 让前端一红就把整个扫描 skip 掉，安全面因此长期不可见。
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare OSV evidence directory
        run: mkdir -p test_output/security-scans

      - name: Install pinned OSV-Scanner
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.0/osv-scanner_linux_amd64
          echo "e774e5770c31d60745c067be5f69bf3b46641b6d0e0ed87fd65e569cda35dc50  /tmp/osv-scanner" \
            | sha256sum --check --strict
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version

      - name: Run raw OSV dependency scan
        # 取证步骤，不是裁决步骤：`scan` 把扫描器退出码（0 干净 / 1 有发现）写进
        # receipt 而不外传，仅在完整性失败时返回 2。放行这里是为了让后续 SARIF
        # 转换与证据上传仍能执行；receipt 里的完整性错误会被下面的 `evaluate`
        # 重新读出并阻断，所以这里去掉 continue-on-error 只会丢证据、不会多拦一个漏洞。
        continue-on-error: true
        run: |
          python scripts/osv_reconciliation_gate.py scan \
            --scanner /tmp/osv-scanner \
            --raw-report test_output/security-scans/osv-report.json \
            --scan-receipt test_output/security-scans/osv-scan-receipt.json

      - name: Convert raw OSV evidence to SARIF without deciding the release gate
        uses: google/osv-scanner-action/osv-reporter-action@9ca325867d8b4f9a3ccd4a0ca372e3cc7fcee3ef # v2.3.0
        with:
          scan-args: |-
            --output=test_output/security-scans/osv-results.sarif
            --new=test_output/security-scans/osv-report.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Reconcile only exact approved OSV tuples
        if: ${{ always() }}
        run: |
          python scripts/osv_reconciliation_gate.py evaluate \
            --raw-report test_output/security-scans/osv-report.json \
            --scan-receipt test_output/security-scans/osv-scan-receipt.json \
            --records docs/audits/osv-reconciliation-records.json \
            --output test_output/security-scans/osv-adjudication.json

      - name: Upload raw and adjudicated OSV evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-evidence
          path: |
            test_output/security-scans/osv-report.json
            test_output/security-scans/osv-scan-receipt.json
            test_output/security-scans/osv-adjudication.json
            test_output/security-scans/osv-results.sarif

      - name: Upload OSV SARIF to code scanning
        if: ${{ always() && hashFiles('test_output/security-scans/osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@014f16e7ab1402f30e7c3329d33797e7948572db # v4.31.3
        with:
          sarif_file: test_output/security-scans/osv-results.sarif
