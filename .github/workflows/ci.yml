name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Check backend uv.lock consistency
        run: uv lock --check --project backend

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Run bounded backend release suite
        run: python scripts/backend_release_suite.py

      - name: Run agent harness tests
        run: python -m pytest tests/test_agent_eval_spec.py tests/test_agent_eval_reward.py -q

  backend-full-pytest:
    name: Backend Full Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Run full backend pytest suite
        run: python -m pytest -q

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run Vitest
        run: npx vitest run

      - name: Frontend debt audit
        run: npm run debt:audit

      - name: Production build
        run: VITE_DATA_SOURCE=real npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Frontend accessibility smoke
        env:
          MOSS_PLAYWRIGHT_USE_WEB_SERVER: "1"
          MOSS_PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5888"
        run: npm run test:a11y-smoke

      - name: Frontend stock-analysis mock smoke
        env:
          MOSS_PLAYWRIGHT_USE_WEB_SERVER: "1"
          MOSS_PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5888"
          VITE_DATA_SOURCE: "mock"
        run: npm run test:a11y-smoke -- tests/playwright/stock-analysis-mock-smoke.spec.mjs

  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Surface naming lint
        working-directory: .
        run: node scripts/check_surface_naming.mjs

      - name: ESLint
        run: npx eslint .

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend tooling
        working-directory: frontend
        run: npm ci

      - name: Export OpenAPI contract
        run: python scripts/api_contract_check.py export-openapi --output .codex-tmp/openapi.json

      - name: Lint OpenAPI contract
        run: npx --prefix frontend spectral lint .codex-tmp/openapi.json -r .spectral.yaml

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz |
            sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: python scripts/supply_chain_security_scan.py --tool gitleaks

      - name: Run supply-chain scan plan
        run: python scripts/supply_chain_security_scan.py --dry-run

      - name: Upload secret scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: test_output/security-scans/gitleaks-report.json

  osv:
    name: OSV Dependency Scan
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Prepare OSV evidence directory
        run: mkdir -p test_output/security-scans

      - name: Install pinned OSV-Scanner
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.0/osv-scanner_linux_amd64
          echo "e774e5770c31d60745c067be5f69bf3b46641b6d0e0ed87fd65e569cda35dc50  /tmp/osv-scanner" \
            | sha256sum --check --strict
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version

      - name: Run raw OSV dependency scan
        continue-on-error: true
        run: |
          python scripts/osv_reconciliation_gate.py scan \
            --scanner /tmp/osv-scanner \
            --raw-report test_output/security-scans/osv-report.json \
            --scan-receipt test_output/security-scans/osv-scan-receipt.json

      - name: Convert raw OSV evidence to SARIF without deciding the release gate
        uses: google/osv-scanner-action/osv-reporter-action@9ca325867d8b4f9a3ccd4a0ca372e3cc7fcee3ef # v2.3.0
        with:
          scan-args: |-
            --output=test_output/security-scans/osv-results.sarif
            --new=test_output/security-scans/osv-report.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Reconcile only exact approved OSV tuples
        if: ${{ always() }}
        run: |
          python scripts/osv_reconciliation_gate.py evaluate \
            --raw-report test_output/security-scans/osv-report.json \
            --scan-receipt test_output/security-scans/osv-scan-receipt.json \
            --records docs/audits/osv-reconciliation-records.json \
            --output test_output/security-scans/osv-adjudication.json

      - name: Upload raw and adjudicated OSV evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-evidence
          path: |
            test_output/security-scans/osv-report.json
            test_output/security-scans/osv-scan-receipt.json
            test_output/security-scans/osv-adjudication.json
            test_output/security-scans/osv-results.sarif

      - name: Upload OSV SARIF to code scanning
        if: ${{ always() && hashFiles('test_output/security-scans/osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@014f16e7ab1402f30e7c3329d33797e7948572db # v4.31.3
        with:
          sarif_file: test_output/security-scans/osv-results.sarif
