name: Caliber PR Gate

on:
  pull_request:
    branches: ["codex/V1"]

permissions:
  contents: read

jobs:
  caliber-pr-gate:
    name: Caliber PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend test dependencies
        run: uv sync --frozen --project backend --extra dev --python 3.11

      # Run the map guard before trusting the PR's selector output.
      - name: Verify mapping and CI workflow contract
        run: backend/.venv/bin/python -m pytest -q tests/test_caliber_gate_mapping.py tests/test_ci_workflow_contents.py

      - name: Run selected regressions against the PR base
        run: |
          git fetch origin "${{ github.base_ref }}"
          backend/.venv/bin/python scripts/check_caliber_gate.py --base-ref "origin/${{ github.base_ref }}"
