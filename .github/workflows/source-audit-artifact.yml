name: Source Audit Artifact

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA; blank uses the dispatched revision
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build commit-scoped source audit artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ inputs.commit || github.sha }}
      SCAN_DIR: ${{ runner.temp }}/moss-source-audit-scan/${{ inputs.commit || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Build deterministic source artifact
        env:
          SOURCE_COMMIT: ${{ inputs.commit || github.sha }}
        run: >-
          python scripts/build_source_audit_artifact.py
          --commit "$SOURCE_COMMIT"
          --output-dir "source-audit-artifacts/$SOURCE_COMMIT"
          --scan-dir "$SCAN_DIR"

      - name: Scan exported target commit
        env:
          EMPTY_GITLEAKS_IGNORE: ${{ runner.temp }}/moss-source-audit-empty.gitleaksignore
        run: |
          set -euo pipefail
          : > "$EMPTY_GITLEAKS_IGNORE"
          gitleaks dir "$SCAN_DIR" \
            --config ".gitleaks.toml" \
            --gitleaks-ignore-path "$EMPTY_GITLEAKS_IGNORE" \
            --ignore-gitleaks-allow \
            --exit-code 1 \
            --max-archive-depth 2 \
            --max-decode-depth 2 \
            --report-format json \
            --report-path "source-audit-artifacts/$SOURCE_COMMIT/gitleaks-report.json" \
            --no-banner \
            --redact

      - name: Upload source archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-${{ inputs.commit || github.sha }}
          path: |
            source-audit-artifacts/${{ inputs.commit || github.sha }}/moss-v3-source-audit-${{ inputs.commit || github.sha }}.zip
            source-audit-artifacts/${{ inputs.commit || github.sha }}/moss-v3-source-audit-${{ inputs.commit || github.sha }}.manifest.json
          if-no-files-found: error
          retention-days: 30
