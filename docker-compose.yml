services:
  api:
    image: python:3.14-slim
    working_dir: /workspace
    command: sh -c "pip install -e ./backend[dev] && python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/workspace
    environment:
      MOSS_ENVIRONMENT: development
      MOSS_POSTGRES_DSN: postgresql://${MOSS_POSTGRES_USER:-moss}:${MOSS_POSTGRES_PASSWORD:?Set MOSS_POSTGRES_PASSWORD for docker compose}@postgres:5432/${MOSS_POSTGRES_DB:-moss}
      MOSS_REDIS_DSN: redis://redis:6379/0
      MOSS_DUCKDB_PATH: data/moss.duckdb
      MOSS_MINIO_ENDPOINT: minio:9000
      MOSS_MINIO_ACCESS_KEY: ${MOSS_MINIO_ROOT_USER:?Set MOSS_MINIO_ROOT_USER for docker compose}
      MOSS_MINIO_SECRET_KEY: ${MOSS_MINIO_ROOT_PASSWORD:?Set MOSS_MINIO_ROOT_PASSWORD for docker compose}
      MOSS_MINIO_BUCKET: moss-artifacts
    depends_on:
      - postgres
      - redis
      - minio
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)); sys.exit(0 if payload.get('status') == 'ok' else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    image: python:3.14-slim
    working_dir: /workspace
    command: sh -c "pip install -e ./backend[dev] && python -m dramatiq --processes 1 --threads 8 backend.app.tasks.worker_bootstrap"
    volumes:
      - ./:/workspace
    environment:
      MOSS_ENVIRONMENT: development
      MOSS_POSTGRES_DSN: postgresql://${MOSS_POSTGRES_USER:-moss}:${MOSS_POSTGRES_PASSWORD:?Set MOSS_POSTGRES_PASSWORD for docker compose}@postgres:5432/${MOSS_POSTGRES_DB:-moss}
      MOSS_REDIS_DSN: redis://redis:6379/0
      MOSS_DUCKDB_PATH: data/moss.duckdb
      MOSS_SKIP_STARTUP_STORAGE_MIGRATIONS: "1"
      MOSS_MINIO_ENDPOINT: minio:9000
      MOSS_MINIO_ACCESS_KEY: ${MOSS_MINIO_ROOT_USER:?Set MOSS_MINIO_ROOT_USER for docker compose}
      MOSS_MINIO_SECRET_KEY: ${MOSS_MINIO_ROOT_PASSWORD:?Set MOSS_MINIO_ROOT_PASSWORD for docker compose}
      MOSS_MINIO_BUCKET: moss-artifacts
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MOSS_POSTGRES_DB:-moss}
      POSTGRES_USER: ${MOSS_POSTGRES_USER:-moss}
      POSTGRES_PASSWORD: ${MOSS_POSTGRES_PASSWORD:?Set MOSS_POSTGRES_PASSWORD for docker compose}
    ports:
      - "127.0.0.1:${MOSS_POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${MOSS_REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MOSS_MINIO_ROOT_USER:?Set MOSS_MINIO_ROOT_USER for docker compose}
      MINIO_ROOT_PASSWORD: ${MOSS_MINIO_ROOT_PASSWORD:?Set MOSS_MINIO_ROOT_PASSWORD for docker compose}
    ports:
      - "127.0.0.1:${MOSS_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MOSS_MINIO_CONSOLE_PORT:-9001}:9001"

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ] ||
      ! cmp package-lock.json node_modules/.moss-package-lock.json >/dev/null 2>&1;
      then npm ci --legacy-peer-deps --include=optional &&
      cp package-lock.json node_modules/.moss-package-lock.json;
      fi && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    environment:
      MOSS_VITE_API_PROXY: http://api:8000
    ports:
      - "127.0.0.1:${MOSS_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  frontend_node_modules:
