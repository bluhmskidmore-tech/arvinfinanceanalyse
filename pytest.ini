[pytest]
# Local fast loop tip (not a default addopt — materialize still runs in CI/full suites):
#   python -m pytest -m "unit and not materialize" -q
# Parallel run tip (pytest-xdist installed; verified equivalent results vs serial, ~2x faster):
#   python -m pytest -n 4 -q
# Keep -n out of addopts so single-file debugging and -s/--pdb workflows stay unaffected.
addopts =
    --basetemp=.codex-tmp/pytest-basetemp
    --ignore-glob=.tmp*
    --ignore-glob=tmp*
    --ignore-glob=py_temp*
    --ignore-glob=py_verify
    --strict-markers
cache_dir = .codex-tmp/pytest-cache
testpaths =
    tests
    backend/tests
markers =
    unit: fast isolated tests that do not rebuild shared DuckDB state
    integration: tests that exercise API/service/task integration boundaries
    materialize: tests that rebuild DuckDB or governed materialization fixtures
    governance_meta: tests that validate governance documents, scripts, or package metadata
    mcp_fast: deterministic MCP contracts used in local and pull-request feedback loops
    mcp_stdio: bounded real-process MCP protocol smoke tests
    mcp_full: complete MCP regression including catalog and governance integration scenarios
norecursedirs =
    .git
    .hypothesis
    .omx
    .venv
    .pytest_cache
    .ruff_cache
    .tmp*
    tmp*
    py_temp*
    py_verify
