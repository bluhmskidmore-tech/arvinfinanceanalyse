[pytest]
# Interpreter: never invoke a bare `python` here. On developer machines it is often shadowed by
# an unrelated venv that has no pytest (or a different dependency set, which is worse: it can
# report green for code that is not this repo's). Use the repo venv explicitly:
#   Windows: .\.venv\Scripts\python.exe -m pytest -q
#   POSIX:   .venv/bin/python -m pytest -q
# Marker subset — NOT a pre-commit gate: `-m "unit and not materialize"` selects 116 of 9882
# collected tests (~1.2%; measured 2026-08-13, only 9 test files carry @pytest.mark.unit).
# It is useful while iterating on those files and says nothing about the other ~9700 tests.
# The repo's pre-merge backend gate is `scripts/backend_release_suite.py` (see docs/TESTING.md).
# Parallel run tip (pytest-xdist installed; verified equivalent results vs serial, ~2x faster):
#   .\.venv\Scripts\python.exe -m pytest -n 4 -q
# Keep -n out of addopts so single-file debugging and -s/--pdb workflows stay unaffected.
addopts =
    --ignore-glob=.tmp*
    --ignore-glob=tmp*
    --ignore-glob=py_temp*
    --ignore-glob=py_verify
    --strict-markers
cache_dir = .codex-tmp/pytest-cache
testpaths =
    tests
    backend/tests
markers =
    unit: fast isolated tests that do not rebuild shared DuckDB state
    integration: tests that exercise API/service/task integration boundaries
    materialize: tests that rebuild DuckDB or governed materialization fixtures
    governance_meta: tests that validate governance documents, scripts, or package metadata
    mcp_fast: deterministic MCP contracts used in local and pull-request feedback loops
    mcp_stdio: bounded real-process MCP protocol smoke tests
    mcp_full: complete MCP regression including catalog and governance integration scenarios
    excluded_surface_regression: grandfathered fail-closed/contract guards on surfaces outside the Phase 2 default boundary
    excluded_surface_acceptance: feature/workflow/ETL acceptance on surfaces outside the Phase 2 default boundary; excluded from default gates
    surface_agent_mvp: Agent MVP / real /api/agent/query enablement
    surface_agent_eval: Agent eval harness (collection, scoring, replay, rollout)
    surface_livermore: Livermore strategy and candidate-history surfaces
    surface_macro_toolkit: macro toolkit scripts, refresh chains, and analytical expansion
    surface_qdb_gl: qdb_gl_monthly_analysis analytical-only module
    surface_liability_analytics: liability_analytics_compat compatibility module
    surface_source_preview: source_preview ingestion and preview flow
    surface_choice_news: choice-news vendor read surfaces
    surface_executive: executive surfaces beyond the landed E1 stable set
    surface_macro_data: macro-data vendor surfaces
    surface_market_data: market-data preview/vendor surfaces outside Livermore
norecursedirs =
    .git
    .hypothesis
    .omx
    .venv
    .pytest_cache
    .ruff_cache
    .tmp*
    tmp*
    py_temp*
    py_verify
